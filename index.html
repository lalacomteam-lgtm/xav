<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XAV - Make Your Own Colorful Way</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 프로모션 배너 -->
    <div class="promo-banner">
        <p>WELCOME GIFT) 첫 구매혜택</p>
    </div>

    <!-- 메인 네비게이션 -->
    <header class="main-header">
        <button class="hamburger" aria-label="메뉴 열기">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav class="nav-left">
            <a href="#about">ABOUT</a>
            <a href="#collection">COLLECTION</a>
            <a href="#shop">SHOP</a>
            <a href="#zine">XAV.ZINE</a>
            <a href="#warranty">WARRANTY</a>
        </nav>
        <a href="#" class="logo">XAV</a>
        <nav class="nav-right">
            <a href="#board">BOARD</a>
            <a href="#account" class="account-link">
                <svg class="account-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span class="nav-text">ACCOUNT</span>
            </a>
            <a href="#cart" class="cart-link">
                <svg class="cart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <span class="cart-count">(0)</span>
            </a>
        </nav>
    </header>

    <!-- 모바일 메뉴 -->
    <div class="mobile-menu">
        <nav class="mobile-nav">
            <a href="#about">ABOUT</a>
            <a href="#collection">COLLECTION</a>
            <a href="#shop">SHOP</a>
            <a href="#zine">XAV.ZINE</a>
            <a href="#warranty">WARRANTY</a>
            <a href="#board">BOARD</a>
            <a href="#account">ACCOUNT</a>
        </nav>
    </div>

    <!-- 히어로 섹션 -->
    <main class="hero-section">
        <div class="hero-left">
            <div class="hero-image-wrapper">
                <img src="https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=800&q=80" alt="XAV 컬렉션 - 여성 패션">
                <div class="circular-text">
                    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                        <path id="curve" fill="none" d="M 100, 100 m -75, 0 a 75,75 0 1,1 150,0 a 75,75 0 1,1 -150,0"/>
                        <text fill="rgba(255,255,255,0.9)" font-size="14" font-family="DM Sans, sans-serif" font-weight="500">
                            <textPath href="#curve" startOffset="0">
                                MAKE YOUR OWN COLORFUL WAY "beyond XAV" 
                            </textPath>
                        </text>
                    </svg>
                </div>
            </div>
        </div>
        <div class="hero-right">
            <div class="hero-image-wrapper">
                <img src="https://images.unsplash.com/photo-1496747611176-843222e1e57c?w=800&q=80" alt="XAV 컬렉션 - 여성 패션">
                <div class="watermark">XAV</div>
            </div>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
